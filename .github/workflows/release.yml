name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v${TAG} stimmt nicht mit package.json-Version ${PKG} überein."
            exit 1
          fi
          echo "Version OK: ${PKG}"

      - name: Install dependencies
        run: npm ci

      # Build only — publish in a final job so Win+Linux don't race on the same tag.
      # signAndEditExecutable=true embeds icon.ico into the .exe (false leaves the
      # Electron default logo). Local Windows builds keep false to avoid winCodeSign
      # download hangs under Defender; CI is fine with CSC discovery off.
      - name: Build Windows NSIS installer
        run: >
          npm run build &&
          npx electron-builder --win --x64 --publish never
          --config.win.signAndEditExecutable=true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/Fax-Inbox-Setup-*.exe
            release/Fax-Inbox-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  release-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v${TAG} stimmt nicht mit package.json-Version ${PKG} überein."
            exit 1
          fi
          echo "Version OK: ${PKG}"

      - name: Install dependencies
        run: npm ci

      - name: Build Linux .deb + AppImage
        run: npm run build && npx electron-builder --linux deb AppImage --x64 --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            release/Fax-Inbox-*.deb
            release/Fax-Inbox-*.AppImage
            release/latest-linux.yml
          if-no-files-found: error

  publish-release:
    needs: [release-windows, release-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist-release

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: dist-release

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
